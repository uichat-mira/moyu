name: Moyu ESA Pages Staging

# Isolated ESA staging proof of deployment, not production promotion.
# Only test-branch push deploys; workflow_dispatch is reserved for when registered on the default branch.
# Production remains owned by uichat-mira/mira-cloud-infra.
on:
  push:
    branches: [test]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moyu-esa-staging
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Build and publish ESA staging
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Require the accepted test branch
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/test" ]]; then
            echo "::error::ESA staging only accepts the test branch; promote via dev -> test first."
            exit 1
          fi

      - name: Checkout Moyu test candidate
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Match the exact, reviewed Folio build input used by Moyu CI.
      # Never substitute a moving Folio branch or publish a Folio package.
      - name: Checkout pinned Folio source
        uses: actions/checkout@v4
        with:
          repository: uichat-mira/folio
          ref: a0d7c88c23b1a9f39b56d016626c2257659b57ae
          path: .folio-build-source
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Pack frozen Folio source without changing the lockfile
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund --prefix .folio-build-source
          mkdir -p "$RUNNER_TEMP/folio-package"
          npm pack --workspace @uichat-mira/folio \
            --prefix .folio-build-source \
            --pack-destination "$RUNNER_TEMP/folio-package"

      - name: Install Moyu and overlay the reviewed Folio build input
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          tarball="$(find "$RUNNER_TEMP/folio-package" -maxdepth 1 -name '*.tgz' -print -quit)"
          test -n "$tarball"
          npm install --no-save --package-lock=false --no-audit --no-fund "$tarball"

      - name: Build and verify root-domain static output
        run: npm run check
        env:
          SITE_ORIGIN: https://6260381.xyz
          VITE_SITE_BASE: /

      - name: Install pinned Alibaba Cloud ESA CLI
        run: |
          npm install --global esa-cli@1.0.13
          esa-cli --version

      - name: Publish to ESA staging only
        shell: bash
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: |
          set -euo pipefail
          if [[ -z "$ALIBABA_CLOUD_ACCESS_KEY_ID" || -z "$ALIBABA_CLOUD_ACCESS_KEY_SECRET" ]]; then
            echo "::error::Both Alibaba Cloud AccessKey repository secrets are required."
            exit 1
          fi
          # No custom domain, route, DNS, or production release is changed.
          # --no-preview keeps preview access tokens out of Actions logs.
          esa-cli deploy \
            --environment staging \
            --no-preview \
            --description "Moyu test $GITHUB_SHA"
