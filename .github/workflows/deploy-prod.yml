name: Deploy Moyu to domestic Caddy server

# Production only: build on GitHub Actions, upload dist/ to a dedicated
# version directory, then atomically move current. Never touch Folio's repo.
on:
  push:
    branches: [prod]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moyu-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    if: github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Exact commit already accepted in the public Moyu preview.
      # Read-only build input. Never change Folio's source or release tags.
      - name: Checkout frozen Folio build input
        uses: actions/checkout@v4
        with:
          repository: uichat-mira/folio
          ref: a0d7c88c23b1a9f39b56d016626c2257659b57ae
          path: .folio-build-source
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Validate production origin
        env:
          MOYU_SITE_ORIGIN: ${{ vars.MOYU_SITE_ORIGIN }}
        run: |
          set -euo pipefail
          [[ "$MOYU_SITE_ORIGIN" =~ ^https://[a-zA-Z0-9.-]+(:[0-9]+)?$ ]] || {
            echo "::error::Set MOYU_SITE_ORIGIN to https://hostname (no path)."
            exit 1
          }
          [[ "$MOYU_SITE_ORIGIN" == "https://6260381.xyz" ]] || {
            echo "::error::Production canonical origin must equal https://6260381.xyz."
            exit 1
          }

      - name: Pack frozen Folio build input
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund --prefix .folio-build-source
          mkdir -p "$RUNNER_TEMP/folio-package"
          npm pack --workspace @uichat-mira/folio \
            --prefix .folio-build-source \
            --pack-destination "$RUNNER_TEMP/folio-package"

      - name: Install Moyu dependencies and frozen build input
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          tarball="$(find "$RUNNER_TEMP/folio-package" -maxdepth 1 -name '*.tgz' -print -quit)"
          test -n "$tarball"
          npm install --no-save --package-lock=false --no-audit --no-fund "$tarball"
          node --input-type=module -e 'import {selectFolioCollectionDocs,folioCollectionIndexes,FolioToc} from "@uichat-mira/folio"; if(typeof FolioToc!=="function" || typeof selectFolioCollectionDocs!=="function" || typeof folioCollectionIndexes!=="function") process.exit(1)'

      - name: Typecheck, build and verify actual production output
        env:
          SITE_ORIGIN: ${{ vars.MOYU_SITE_ORIGIN }}
          VITE_SITE_BASE: /
        run: |
          set -euo pipefail
          npm run check
          if grep -r -l -F 'https://uichat-mira.github.io/moyu/images/' dist/blogs; then
            echo "::error::A production article still references Pages-hosted images."
            exit 1
          fi
          test -s dist/index.html
          test -s dist/blogs/index.html
          test -s dist/projects/index.html
          test -s dist/sitemap.xml

      - name: Preserve immutable build artifact
        uses: actions/upload-artifact@v4
        with:
          name: moyu-prod-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Publish dist/ to the dedicated server directory
        env:
          MOYU_DEPLOY_HOST: ${{ vars.MOYU_DEPLOY_HOST }}
          MOYU_DEPLOY_USER: ${{ vars.MOYU_DEPLOY_USER }}
          MOYU_DEPLOY_ROOT: ${{ vars.MOYU_DEPLOY_ROOT }}
          MOYU_DEPLOY_KEY: ${{ secrets.MOYU_DEPLOY_KEY }}
          MOYU_KNOWN_HOSTS: ${{ secrets.MOYU_KNOWN_HOSTS }}
        run: bash scripts/deploy-prod.sh

      - name: HTTP smoke of the deployed site
        env:
          SITE_ORIGIN: ${{ vars.MOYU_SITE_ORIGIN }}
        run: |
          set -euo pipefail
          for path in / /blogs/ /projects/ /docs/about/ /blogs/ai-agent-ux-rant/; do
            curl --fail --silent --show-error --location --retry 5 --retry-delay 3 \
              --max-time 20 "$SITE_ORIGIN$path" > /dev/null
          done
