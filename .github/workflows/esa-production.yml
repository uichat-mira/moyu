name: Moyu ESA Pages Legacy Manual Fallback

# Huawei ECS is the production authority.
# This workflow only prepares the historical ESA production artifact when a maintainer
# deliberately chooses the emergency fallback path. It never changes DNS or claims
# that the public site has switched to ESA.
on:
  workflow_dispatch:
    inputs:
      acknowledge_legacy_fallback:
        description: "I am intentionally preparing the legacy ESA fallback artifact"
        required: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: moyu-esa-legacy-fallback
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare ESA fallback artifact
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Require explicit fallback acknowledgement
        shell: bash
        run: |
          if [[ "${{ inputs.acknowledge_legacy_fallback }}" != "true" ]]; then
            echo "::error::Legacy ESA fallback was not explicitly acknowledged."
            exit 1
          fi

      - name: Enforce production source
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/prod" ]]; then
            echo "::error::ESA fallback artifact must be prepared from the prod branch."
            exit 1
          fi

      - name: Checkout Moyu production source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Checkout released Folio 0.2.0 production source
        uses: actions/checkout@v4
        with:
          repository: uichat-mira/folio
          ref: eabb0c546a642ad3cb30744a6c69baecec357233
          path: .folio-build-source
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Pack frozen Folio input
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund --prefix .folio-build-source
          mkdir -p "$RUNNER_TEMP/folio-package"
          npm pack --workspace @uichat-mira/folio \
            --prefix .folio-build-source \
            --pack-destination "$RUNNER_TEMP/folio-package"

      - name: Install Moyu dependencies and audited Folio build
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          tarball="$(find "$RUNNER_TEMP/folio-package" -maxdepth 1 -name '*.tgz' -print -quit)"
          test -n "$tarball"
          npm install --no-save --package-lock=false --no-audit --no-fund "$tarball"

      - name: Verify root-domain static build
        run: npm run check
        env:
          SITE_ORIGIN: https://6260381.xyz
          VITE_SITE_BASE: /

      - name: Install ESA CLI
        run: |
          npm install --global esa-cli@1.0.13
          esa-cli --version

      - name: Preflight activated ESA site and credentials
        shell: bash
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: |
          set -euo pipefail
          if [[ -z "$ALIBABA_CLOUD_ACCESS_KEY_ID" || -z "$ALIBABA_CLOUD_ACCESS_KEY_SECRET" ]]; then
            echo "::error::Missing Alibaba Cloud AccessKey repository secrets."
            exit 1
          fi
          sites="$(esa-cli site list)"
          printf '%s\n' "$sites"
          if ! printf '%s\n' "$sites" | grep -Eq '(^|[^[:alnum:].-])6260381[.]xyz([^[:alnum:].-]|$)'; then
            echo "::error::ESA fallback site 6260381.xyz is not active under this account."
            exit 1
          fi

      - name: Publish fallback artifact to ESA production environment
        shell: bash
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: |
          set -euo pipefail
          esa-cli deploy \
            --environment production \
            --no-preview \
            --description "Moyu legacy fallback $GITHUB_SHA"

      - name: Verify ESA domain binding remains available
        shell: bash
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: |
          set -euo pipefail
          bound="$(esa-cli domain list 2>&1)"
          printf '%s\n' "$bound"
          if ! printf '%s\n' "$bound" | grep -Eq '(^|[^[:alnum:].-])6260381[.]xyz([^[:alnum:].-]|$)'; then
            echo "::error::ESA fallback domain binding is unavailable."
            exit 1
          fi
          echo "ESA fallback artifact prepared."
          echo "Public DNS was not modified; Huawei remains production until a separately reviewed DNS proxy cutover."
