name: Folio Pages Preview

# GitHub Pages is a public review preview, not the owner's live EdgeOne website.
# Only the maintainer-updated pages-preview branch deploys; feature/dev/test pushes never deploy.
on:
  push:
    branches: [pages-preview]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: moyu-pages-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build and verify GitHub Pages project-path preview
        run: npm run check
        env:
          SITE_ORIGIN: https://uichat-mira.github.io
          VITE_SITE_BASE: /moyu/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
