name: Folio Pages Preview

# Preview-only runtime: checkout the exact Folio 0.2.0 production commit,
# pack its public npm artifact and test it as an independent Moyu consumer.
# package-lock.json also consumes the public @uichat-mira/folio@0.2.0 release.
# This frozen source overlay proves the reviewed build input matches the released runtime.
on:
  push:
    branches: [pages-preview]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moyu-pages-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch pinned Folio 0.2.0 production source
        uses: actions/checkout@v4
        with:
          repository: uichat-mira/folio
          ref: eabb0c546a642ad3cb30744a6c69baecec357233
          path: .folio-preview-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Pack frozen Folio 0.2.0 source for isolated preview
        run: |
          npm ci --no-audit --no-fund --prefix .folio-preview-source
          mkdir -p "$RUNNER_TEMP/folio-preview-pkg"
          npm pack --workspace @uichat-mira/folio --prefix .folio-preview-source --pack-destination "$RUNNER_TEMP/folio-preview-pkg"
          ls -la "$RUNNER_TEMP/folio-preview-pkg"
      - name: Install published Moyu dependencies and overlay the matching frozen Folio source
        run: |
          npm ci --no-audit --no-fund
          tarball="$(find "$RUNNER_TEMP/folio-preview-pkg" -maxdepth 1 -name '*.tgz' -print -quit)"
          test -n "$tarball"
          npm install --no-save --package-lock=false --no-audit --no-fund "$tarball"
          node --input-type=module -e 'import {selectFolioCollectionDocs,folioCollectionIndexes,FolioToc} from "@uichat-mira/folio"; const xs=selectFolioCollectionDocs([{path:"/notes/2026/deep/a",title:"Nested"}],"/notes"); if(xs.length!==1 || folioCollectionIndexes({title:"X",description:"D",collections:[{path:"/notes"}]}).length!==1 || typeof FolioToc!=="function") process.exit(1); console.log("Folio 0.2.0 collection and TOC APIs installed")'
      - name: Build and verify GitHub Pages project-path preview
        run: npm run check
        env:
          SITE_ORIGIN: https://uichat-mira.github.io
          VITE_SITE_BASE: /moyu/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy isolated review preview
        id: deployment
        uses: actions/deploy-pages@v4
