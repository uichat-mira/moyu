name: ESA Apex DNS Read-Only Audit
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    if: github.ref == 'refs/heads/prod'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned ESA read SDK
        run: python -m pip install alibabacloud_esa20240910==3.16.0
      - name: List exact apex DNS records (NO modifications)
        env:
          ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
          ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
        run: python scripts/esa_dns_audit.py
